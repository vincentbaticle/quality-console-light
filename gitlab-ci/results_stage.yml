---
results-index:
  stage: results
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --no-cache-dir "pdm==${PDM_VERSION}"
    - pdm install --frozen-lockfile --prod
  script:
    - pdm run python -m scripts.build_results_index
  needs: []
  rules: !reference [.rules, results-index]
