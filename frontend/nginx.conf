server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/identity/ {
        set $identity http://identity:8000;
        proxy_pass $identity;
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
    }
}
