[project]
name = "hello-api"
version = "0.1.0"
description = "Hello world API greeting customers from a MySQL database, counting visits in Redis and showing their bank balance, the backend of the testcontainers demo."
authors = [{name = "QA Core", email = "qa@example.com"}]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.136.0,<0.137.0",
    "uvicorn[standard]>=0.49.0,<0.50.0",
    "redis>=7.0.0,<8.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pymysql>=1.1.0,<2.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "google-cloud-storage>=3.4.0,<4.0.0",
    "defusedxml>=0.7.1,<0.8.0",
    "pika>=1.3.2,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "markdown-it-py>=4.0.0,<5.0.0",
    "numpy<3.0.0,>=2.3.0",
    "soundfile<0.14.0,>=0.13.0",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "opentelemetry-instrumentation-pymysql==0.66b1",
    "opentelemetry-instrumentation-pika==0.66b1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=9.0.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-html>=4.1.0,<5.0.0",
    "pytest-playwright>=0.7.0,<1.0.0",
    "httpx2>=2.13.0,<3.0.0",
    "testcontainers[redis]>=4.15.0,<5.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pytest-bdd>=8.1.0,<9.0.0",
    "pyotp<3.0.0,>=2.9.0",
    "schemathesis<5.0.0,>=4.7.7",
    "mcp<2.0.0,>=1.20.0",
    "hvac<3.0.0,>=2.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "D", "S", "N"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D100", "D103", "D104"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
junit_family = "xunit1"
bdd_features_base_dir = "features/"
markers = [
    "unit: pure logic, no I/O, no Docker",
    "integration: real neighbours started by testcontainers (or CI sidecars)",
    "acceptance: Gherkin scenarios run against the running stack (mise run up)",
    "metadata: who a test belongs to, see tests/metadata.py",
    "recorded: a Gherkin scenario written from a recorded journey, in the template of quality_console/scenario_template.py",
]

[tool.pdm.build]
includes = ["src/hello_api", "src/company_db", "src/quality_console", "src/test_results", "src/order_workflow", "src/catalog", "src/identity", "src/gherkin_runner", "src/quality_mcp", "src/company_secrets"]
package-dir = "src"
