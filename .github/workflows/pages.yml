---
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install the Python dependencies
        run: mise exec -- pdm install
      - name: Start the whole stack
        run: mise run up
      - name: Seed four weeks of CI history
        run: mise run results:seed
      - name: Freeze the console into static pages
        run: mise run demo:freeze
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: freeze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
