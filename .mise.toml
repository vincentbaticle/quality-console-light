[tools]
python = "3.14.7"
pdm = "2.29.1"
prek = "0.5.3"
cocogitto = "7.0.0"
k6 = "1.3.0"

[env]
DOCKER_HOST = "{{env.DOCKER_HOST | default(value='unix://' ~ env.HOME ~ '/.rd/docker.sock')}}"
TESTCONTAINERS_RYUK_DISABLED = "true"
RESULTS_BUCKET = "test-results"
RESULTS_EMULATOR_HOST = "http://localhost:4443"
TEST_ENV = "local"
TRACES_URL = "http://localhost:3000/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22tempo%22%2C%22uid%22%3A%22tempo%22%7D%2C%22queryType%22%3A%22traceql%22%2C%22limit%22%3A20%2C%22tableType%22%3A%22traces%22%2C%22query%22%3A%22%7Bresource.service.name%3D%5C%22hello-api%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-15m%22%2C%22to%22%3A%22now%22%7D%7D%7D"

[settings]
experimental = true

[hooks]
postinstall = [
    "prek install -f && prek install --hook-type commit-msg -f",
]

[task_config]
includes = [
    "mise/app.toml",
    "mise/test.toml",
    "mise/hooks.toml",
]
